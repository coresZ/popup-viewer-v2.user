name: 功能建议
description: 为 Popup Viewer V2 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索[现有 Issues](https://github.com/coresZ/popup-viewer-v2.user/issues)，并阅读 README 与用户手册，确认该功能尚未提供。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true
        - label: 我已阅读 README 与用户手册，确认该功能尚未实现
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 这个建议解决什么问题？在什么场景下需要？
      placeholder: 例如：在 XX 站点阅读长帖时，希望能 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望脚本如何表现？
      placeholder: 描述期望的交互、设置项或行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代方案或临时解决办法？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 所有站点
        - 特定站点（请在补充信息中说明）
        - 仅界面 / 交互
        - 仅设置 / 规则
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附上草图、截图、参考实现或其他上下文。
