name: Release

# 推送 v* tag 时自动发布：测试 → 构建 → 校验版本一致 → 从 CHANGELOG 提取说明 → 创建 GitHub Release 附 dist 产物
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # tag 版本必须与 package.json / 产物头部一致，防止 tag 打错提交
      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致" >&2
            exit 1
          fi
          grep -qE "^// @version[[:space:]]+$TAG_VERSION" dist/popup-viewer-v2.user.js || {
            echo "dist 产物头部 @version 不是 $TAG_VERSION" >&2
            exit 1
          }

      # Release notes 取 CHANGELOG.md 里对应版本的条目（## [x.y.z] 到下一个 ## 之间）
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && $0 ~ /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "v$VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/popup-viewer-v2.user.js
            dist/popup-viewer-kit.js
